services:
  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lumify:lumify@db:5432/lumify?schema=public}
    ports:
      - '${API_BIND_ADDRESS:-0.0.0.0}:${API_HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumify}
      POSTGRES_USER: ${POSTGRES_USER:-lumify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
