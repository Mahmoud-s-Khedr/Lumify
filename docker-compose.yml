services:
  api:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lumify:lumify@db:5432/lumify?schema=public}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumify
      POSTGRES_USER: lumify
      POSTGRES_PASSWORD: lumify
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumify -d lumify']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
